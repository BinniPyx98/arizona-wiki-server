name: Deploy Cloud Function GetGameItem to Yandex Cloud
on:
  push:
    branches:
      - 'ci/github-actions' # Срабатывает при пуше в основную ветку
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout code
        uses: actions/checkout@v4


      # 2. Проверяем ключи
      - name: Validate secrets
        run: |
         echo "YC_FOLDER_ID: '${YC_FOLDER_ID}'"
         echo "DB_KEY: '${DB_KEY}'"
         if [ -z "$YC_FOLDER_ID" ]; then echo "ERROR: YC_FOLDER_ID is missing!" && exit 1; fi
         if [ -z "$DB_KEY" ]; then echo "ERROR: DB_KEY is missing!" && exit 1; fi
        env:
         YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
         DB_KEY: ${{ secrets.DB_KEY }}

      # 3. Упаковываем всё для деплоя в одну папку
      - name: Prepare deployable package
        run: |
          mkdir -p ./deploy
          cp go.mod ./deploy/
          cp go.sum ./deploy/ 2>/dev/null || true
          # Кладем main.go прямо в корень deploy
          cp cmd/get-item/main.go ./deploy/
          # Если есть internal/pkg — тоже копируй сюда
          # cp -r internal ./deploy/

      # 4: Проверка созданной папки
      - name: Debug list deploy folder
        shell: bash
        run: |
          echo "=== Contents of ./deploy ==="
          ls -R ./deploy
          echo "=== First 10 lines of main.go ==="
          head -n 10 ./deploy/main.go
          echo "=== First 5 lines of go.mod ==="
          head -n 5 ./deploy/go.mod

      # 5. Деплоим код в Яндекс Облако
      - name: Deploy Serverless Function
        uses: yc-actions/yc-sls-function@v5
        with:
          yc-sa-json-credentials: ${{ secrets.YANDEX_SERVICE_AC_KEY }}
          # Настройки функции
          folder-id: ${{ secrets.YC_FOLDER_ID }} # ID каталога в облаке
          function-name: 'arz-get-item-function'  # Имя функции в консоли Яндекса
          runtime: 'golang121'                    # Окружение (например: nodejs18, python311, go121)
          entrypoint: 'main.GetItem'            # Точка входа (файл.экспортируемая_функция)
          execution-timeout: '5'                 # Таймаут выполнения в секундах
          memory: '256Mb'
            # environment: |
          #  DATABASE_KEY=${{ secrets.DB_KEY }}
          # Источник кода
          exclude: |                             # Что исключить из архива при деплое
            .git/**
            .github/**